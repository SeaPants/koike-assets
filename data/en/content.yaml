00PersonalData:
  Style: PersonalData
  Title: Personal Data
  Name: Kento Koike
  Biography: "Kento Koike received his B.Eng. in 2018, his M.Eng. in 2020, and his Ph.D. in Engineering in 2023 from Tokyo Polytechnic University. In 2022, he concurrently served as Manager of the manabo Division at manabo, Inc. From 2023, he was a Project Researcher at the Academic Center for Computing and Media Studies, Kyoto University. From 2024, he was an Assistant Professor at the Faculty of Engineering, Tokyo University of Science. Since 2026, he has been an Assistant Professor at the Faculty of Engineering, Kanagawa University. He is also a Collaborative Researcher at the Research Liaison Centre, Chiba Institute of Technology. His research interests include intelligent tutoring systems, cognitive science, and knowledge engineering."
  Information:
    - Name: Name
      Value: Kento Koike
    - Name: Degree
      Value: Ph.D. in Engineering
    - Name: Affiliations
      Items:
        - Department of Electrical, Electronic and Information Engineering, Faculty of Engineering, Kanagawa University
        - Research Liaison Centre, Chiba Institute of Technology
    - Name: Researchmap
      Value: "[Kento Koike](https://researchmap.jp/k_k01ke?lang=en)"
    - Name: Birthday
      Value: "1996-03-05"

